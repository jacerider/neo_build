name: 'Neo | Build | Test Camel'
type: module
description: 'Kernel-test fixture for Neo Build: an extension whose info file declares a Tailwind property name in camelCase, so prepare can be seen to refuse it and name the extension. Never installed alongside the other fixtures — every prepare assertion made against them would fail with it.'
package: 'Neo Test'
version: 1.1.1
core_version_requirement: ^10.3 || ^11
neo:
  scope: front
  utilities:
    .neo-build-test-camel:
      borderRadius: '4px'

name: 'Neo | Build | Test Nested'
type: module
description: 'Kernel-test fixture for Neo Build: an extension whose info file gives a Tailwind key an array value — the old nested selector form — so prepare can be seen to refuse it and name the extension. Never installed alongside the other fixtures.'
package: 'Neo Test'
version: 1.1.1
core_version_requirement: ^10.3 || ^11
neo:
  scope: front
  utilities:
    .neo-build-test-nested:
      '&:hover':
        color: red

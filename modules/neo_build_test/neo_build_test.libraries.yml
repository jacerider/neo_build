# Kernel-test fixture. Each library is a Neo library (`neo:`); the entrypoints
# are source files Neo would hand to Vite, not built assets.

# Front-scoped: one CSS and one TS entrypoint, both on disk. Prepared only by
# the front scope.
front:
  version: VERSION
  neo: { scope: front }
  css:
    component:
      src/css/neoBuildTestFront.css: {}
  js:
    src/js/neoBuildTestFront.ts: {}
  dependencies:
    - core/drupal
    - core/once

# Back-scoped: the same shape, prepared only by the back scope.
back:
  version: VERSION
  neo: { scope: back }
  css:
    component:
      src/css/neoBuildTestBack.css: {}
  js:
    src/js/neoBuildTestBack.ts: {}
  dependencies:
    - core/drupal
    - core/once

# Both scopes, and its CSS entrypoint deliberately does not exist on disk:
# prepare reports it as a missing entrypoint and skips it.
missing:
  version: VERSION
  neo: true
  css:
    component:
      src/css/neoBuildTestMissing.css: {}

services:
  neo:
    class: Drupal\neo_build\Commands\DrushCommands
    arguments:
      - '%app.root%'
      - '@file_system'
      - '@extension.list.module'
      - '@module_handler'
      - '@extension.list.theme'
      - '@extension.list.neo'
      - '@twig'
      - '@neo_build.preparer'
      - '@config.factory'
      - '@plugin.cache_clearer'
      - '@neo_build.project_root'
      - '@neo_build.dev_server'
      - '@neo_build'
    tags:
      - { name: drush.command }

services:
  neo_build:
    class: Drupal\neo_build\NeoBuild
    arguments: ['@theme.manager', '@extension.list.neo']

  plugin.manager.neo_build_scope:
    class: Drupal\neo_build\ScopePluginManager
    arguments: ['@module_handler', '@cache.discovery']

  neo_build.inline_css_generator:
    class: Drupal\neo_build\NeoInlineCssGenerator
    arguments: ['@event_dispatcher', '@file_system', '@state', '@neo_build']
    tags:
      - { name: cache_tags_invalidator }
      - { name: event_subscriber }

  extension.list.neo:
    class: Drupal\neo_build\NeoExtensionList
    arguments: ['@module_handler', '@extension.list.module', '@extension.list.theme', '@library.discovery.parser']

  neo_build.analysed_extension_resolver:
    class: Drupal\neo_build\AnalysedExtensionResolver
    arguments: ['@extension.list.neo', '@extension.list.module', '@extension.list.theme', '%app.root%']

  neo_build.project_root:
    class: Drupal\neo_build\ProjectRoot
    arguments: ['%app.root%']

  neo_build.preparer:
    class: Drupal\neo_build\Preparer
    arguments:
      - '@extension.list.module'
      - '@theme_handler'
      - '@module_handler'
      - '@state'
      - '@library.discovery'
      - '@event_dispatcher'
      - '@plugin.manager.neo_build_scope'
      - '@extension.list.neo'
      - '@neo_build.analysed_extension_resolver'
      - '@neo_build.project_root'
      - '@file_system'
      - '@cache_tags.invalidator'
      - '%app.root%'
